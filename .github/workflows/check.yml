name: Check theme
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/memesense.js
      - run: python build.py
      - name: Validate release archive
        run: |
          python -c "import zipfile; z=zipfile.ZipFile('MemeSense.zip'); assert z.testzip() is None; assert {'metadata.json','index.html','assets/memesense.js','assets/memesense.css'} <= set(z.namelist())"
      - uses: actions/upload-artifact@v4
        with:
          name: MemeBounce-theme
          path: MemeSense.zip
